<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar and Table</title>
</head>
<body>
    <header>
        <h1>Navigation and Table </h1>
        <nav>
            <ol>
                <li><a href="#table">Table</a></li>
                <li><a href="#form">Form</a></li>
            </ol>
        </nav>
    </header>
    <main>
        <section id = "table">
            <h2>Section 1</h2>
            <table border="1" style="border-collapse: collapse;">
            <caption>Result Table</caption>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>CGPA</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>C253064</td>
                    <td>Akib Akbar</td>
                    <td>3.88</td>
                </tr>
                <tr>
                    <td>C253010</td>
                    <td>Sakif Anam</td>
                    <td>3.92</td>
                </tr>
                <tr>
                    <td>C253011</td>
                    <td>Samir Ali</td>
                    <td>3.8</td>
                </tr>
                <tr>
                    <td>C253062</td>
                    <td>Salsabil Apurbo</td>
                    <td>3.5</td>
                </tr>
                <tr>
                    <td>C253087</td>
                    <td>Hasan Ali</td>
                    <td>3.99</td>
                </tr>
            </tbody>
            </table>
        </section>
        <section id = "form">
            <h2>Student Form</h2>
            <form action="">
                <label for="name">Name -> </label>
                <input type="text" id="name" name="name" required>
                <br><br>
                <label for="email">Email -> </label>
                <input type="email" id="email" name="email" required>
                <br><br>
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>
</html>
